[package]
name = "moonblokz-mempool"
version = "0.1.0"
edition = "2024"
description = "MoonBlokz no_std bounded mempool — compacted byte-buffer + index for pending transactions (FR30)."
license = "MIT"
repository = "https://github.com/petersallai/moonblokz-mempool"
keywords = ["embedded", "no-std", "blockchain", "moonblokz", "mempool"]
categories = ["embedded", "no-std"]

[features]
default = ["schnorr", "block-size-2016"]
# The crypto backend is the binary's choice, forwarded like the block-size tier.
schnorr = ["moonblokz-chain-types/schnorr"]
bls-min-sig = ["moonblokz-chain-types/bls-min-sig"]
bls-min-pk = ["moonblokz-chain-types/bls-min-pk"]
block-size-2016 = ["moonblokz-chain-types/block-size-2016"]
block-size-65536 = ["moonblokz-chain-types/block-size-65536"]
introspection = []

[dependencies]
moonblokz-chain-types = { path = "../moonblokz-chain-types", default-features = false }
rand_xoshiro = { version = "0.7", default-features = false }

# Debug test runs build the curve code optimized (DEC-255): a BLS pairing in an
# unoptimized build is very slow. Only takes effect when this crate is the Cargo root.
[profile.dev.package.moonblokz-crypto]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.bls12_381]
opt-level = 3
[profile.dev.package.ff]
opt-level = 3
[profile.dev.package.group]
opt-level = 3
[profile.dev.package.pairing]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
